<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameZone License</title>
<style>*{box-sizing:border-box}body{margin:0;background:#05070d;color:#eef4ff;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:25px}.card{background:#0b1020;border:1px solid #1c2d4d;border-radius:18px;padding:18px;margin:15px 0}h1{margin:0 0 5px}.muted{color:#8491aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border:1px solid #1b2b48;border-radius:12px}.num{font-size:25px;font-weight:bold;margin-top:5px}input,button{padding:11px;border-radius:9px;border:1px solid #263b61;background:#080d18;color:white}button{background:#1689ff;border:0;font-weight:bold}.danger{background:#b82c40}.form{display:grid;grid-template-columns:1fr 110px 110px 100px;gap:8px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px 6px;border-bottom:1px solid #18253e;text-align:left}.badge{padding:4px 8px;border-radius:20px;background:#123d2b}.bad{background:#47212a}.login{max-width:400px;margin:15vh auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.table{font-size:12px}}</style></head>
<body><div id="login" class="card login"><h1>GAMEZONE</h1><p class="muted">License Dashboard</p><input id="token" type="password" placeholder="Admin token" style="width:100%;margin:10px 0"><button onclick="login()" style="width:100%">LOGIN</button><p id="err"></p></div>
<div id="app" class="wrap" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>GAMEZONE LICENSE</h1><span class="muted">Own license server</span></div><button onclick="location.reload()">Refresh</button></div>
<div class="grid" style="margin-top:15px"><div class="stat">Total<div class="num" id="t">0</div></div><div class="stat">Active<div class="num" id="a">0</div></div><div class="stat">Expired<div class="num" id="e">0</div></div><div class="stat">Revoked<div class="num" id="r">0</div></div></div>
<div class="card"><h2>Create License</h2><div class="form"><input id="key" placeholder="Custom key (optional)"><input id="days" type="number" value="30" min="1"><input id="dev" type="number" value="1" min="1"><button onclick="create()">CREATE</button></div></div>
<div class="card"><h2>Licenses</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Key</th><th>Status</th><th>Expiry</th><th>Devices</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
let token=localStorage.gz_token||"";
const H=()=>({"Content-Type":"application/json","Authorization":"Bearer "+token});
async function api(u,o={}){o.headers=H();let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){token=document.getElementById("token").value.trim();try{await api("/api/admin");localStorage.gz_token=token;openApp()}catch(e){document.getElementById("err").textContent="Invalid token"}}
function openApp(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";load()}
async function load(){let d=await api("/api/admin"),x=d.licenses||[];t.textContent=x.length;a.textContent=x.filter(q=>q.status==="active"&&Date.now()<new Date(q.expiresAt)).length;e.textContent=x.filter(q=>q.status==="expired"||Date.now()>=new Date(q.expiresAt)).length;r.textContent=x.filter(q=>q.status==="revoked").length;rows.innerHTML=x.map(q=>`<tr><td><b>${q.key}</b></td><td><span class="badge ${q.status!=="active"?"bad":""}">${q.status}</span></td><td>${new Date(q.expiresAt).toLocaleString()}</td><td>${(q.devices||[]).length}/${q.deviceLimit}</td><td><button onclick="toggle('${q.key}','${q.status==="revoked"?"active":"revoked"}')">${q.status==="revoked"?"Activate":"Revoke"}</button> <button class="danger" onclick="delx('${q.key}')">Delete</button></td></tr>`).join("")}
async function create(){let x=await api("/api/admin",{method:"POST",body:JSON.stringify({key:key.value.trim()||undefined,days:+days.value,deviceLimit:+dev.value})});alert("Created: "+x.key);load()}
async function toggle(k,s){await api("/api/admin",{method:"PATCH",body:JSON.stringify({key:k,status:s})});load()}
async function delx(k){if(confirm("Delete "+k+"?")){await api("/api/admin?key="+encodeURIComponent(k),{method:"DELETE"});load()}}
if(token)api("/api/admin").then(openApp).catch(()=>localStorage.removeItem("gz_token"));
</script></body></html>
